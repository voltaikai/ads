<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand.css" />
      <style>
        #s02-problem {
          position: absolute;
          inset: 0;
          pointer-events: none;
          overflow: hidden;
        }
        #s02-problem .scene {
          position: absolute;
          inset: 0;
        }
        /* navy glass-wipe panel that becomes the cutaway canvas */
        #s02-problem .panel {
          position: absolute;
          inset: 0;
          background: rgba(19, 48, 74, 0.55);
          -webkit-backdrop-filter: blur(30px);
          backdrop-filter: blur(30px);
          border-top: 1px solid rgba(255, 210, 122, 0.35);
          box-shadow: 0 -40px 80px rgba(19, 48, 74, 0.35);
        }
        #s02-problem .solid {
          position: absolute;
          inset: 0;
          background: var(--navy);
          opacity: 0;
        }
        #s02-problem .glow {
          position: absolute;
          right: -520px;
          top: -560px;
          width: 1500px;
          height: 1500px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(226, 113, 29, 0.14) 0%, rgba(226, 113, 29, 0.06) 38%, rgba(226, 113, 29, 0) 68%);
          opacity: 0;
        }
        #s02-problem .chart {
          position: absolute;
          left: 90px;
          top: 330px;
          width: 900px;
          height: 560px;
          overflow: visible;
        }
        #s02-problem .card {
          position: absolute;
          left: 54px;
          top: 846px;
          width: 972px;
          padding: var(--card-pad-y) var(--card-pad-x);
        }
        #s02-problem .row {
          font-size: 56px;
          line-height: 64px;
          letter-spacing: -0.02em;
          color: var(--white);
        }
        #s02-problem .row + .row {
          margin-top: 24px;
        }
        #s02-problem .row .txt {
          position: relative;
          display: inline-block;
        }
        #s02-problem .row.accent {
          color: var(--poppy);
        }
        #s02-problem .strike {
          position: absolute;
          left: -6px;
          right: -6px;
          top: 31px;
          height: 5px;
          border-radius: 3px;
          background: var(--greyblue);
          transform-origin: 0 50%;
        }
      </style>

      <div id="s02-problem" data-composition-id="s02-problem" data-width="1080" data-height="1920" data-duration="6.1">
        <div class="scene" id="s02-scene">
          <div class="panel" id="s02-panel">
            <div class="solid" id="s02-solid"></div>
            <div class="glow" id="s02-glow"></div>
            <svg class="chart" id="s02-chart" viewBox="0 0 900 560" aria-hidden="true">
              <defs>
                <linearGradient id="s02-area-fill" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#F7941D" stop-opacity="0.22" />
                  <stop offset="1" stop-color="#F7941D" stop-opacity="0" />
                </linearGradient>
              </defs>
              <g id="s02-grid" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2">
                <line x1="0" y1="80" x2="900" y2="80" />
                <line x1="0" y1="200" x2="900" y2="200" />
                <line x1="0" y1="320" x2="900" y2="320" />
                <line x1="0" y1="440" x2="900" y2="440" />
                <line x1="0" y1="540" x2="900" y2="540" />
              </g>
              <path id="s02-area" fill="url(#s02-area-fill)" d="" />
              <path id="s02-line" fill="none" stroke="#F7941D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="" />
              <g id="s02-end-pos">
                <g id="s02-end">
                  <circle id="s02-end-halo" r="26" fill="#FFD27A" fill-opacity="0.22" />
                  <circle r="10" fill="#FFD27A" />
                </g>
              </g>
            </svg>
            <div class="card glass" id="s02-card">
              <div class="sweep" id="s02-sweep"></div>
              <div class="row headline" id="s02-row1"><span class="txt">Using more power<span class="strike" id="s02-strike"></span></span></div>
              <div class="row headline accent" id="s02-row2"><span class="txt" id="s02-row2-txt">Rates keep rising</span></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          // illustrative climb — no values, no axes. Catmull-Rom → cubic Bézier, built once.
          var P = [[0, 500], [110, 478], [210, 462], [300, 470], [400, 418], [500, 392], [590, 400], [680, 318], [770, 236], [840, 170], [900, 92]];
          var d = "M" + P[0][0] + " " + P[0][1];
          for (var i = 0; i < P.length - 1; i++) {
            var p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
            var c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
            var c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
            d += " C" + c1[0].toFixed(1) + " " + c1[1].toFixed(1) + " " + c2[0].toFixed(1) + " " + c2[1].toFixed(1) + " " + p2[0] + " " + p2[1];
          }
          var line = document.getElementById("s02-line");
          line.setAttribute("d", d);
          document.getElementById("s02-area").setAttribute("d", d + " L900 560 L0 560 Z");
          var end = P[P.length - 1];
          document.getElementById("s02-end-pos").setAttribute("transform", "translate(" + end[0] + " " + end[1] + ")");
          var L = Math.ceil(line.getTotalLength ? line.getTotalLength() : 1200);
          line.style.strokeDasharray = L + " " + L;

          var tl = gsap.timeline({ paused: true });

          // glass wipe: frosted navy panel rises over the shot, then turns into the canvas
          tl.fromTo("#s02-panel", { y: 1920 }, { y: 0, duration: 0.5, ease: "power3.inOut" }, 0);
          tl.fromTo("#s02-solid", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.inOut" }, 0.35);
          tl.fromTo("#s02-glow", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 0.45);
          tl.to("#s02-glow", { scale: 1.06, duration: 4.3, ease: "sine.inOut" }, 1.65);
          tl.fromTo("#s02-grid line", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out", stagger: 0.06 }, 0.4);

          // the line climbs ("bills climb every single month")
          tl.fromTo(line, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 1.65, ease: "power2.inOut" }, 0.3);
          tl.fromTo("#s02-area", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out" }, 0.9);
          tl.fromTo("#s02-end", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.6, ease: "expo.out" }, 1.85);

          // glass card + row 1
          tl.fromTo("#s02-card", { opacity: 0, y: 40, scale: 0.94, filter: "blur(12px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.85, ease: "expo.out" }, 2.05);
          tl.fromTo("#s02-row1", { opacity: 0, y: 30, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "expo.out" }, 2.25);
          tl.set("#s02-sweep", { opacity: 1, xPercent: -110 }, 3.0);
          tl.to("#s02-sweep", { xPercent: 260, duration: 0.9, ease: "power2.inOut" }, 3.0);
          tl.set("#s02-sweep", { opacity: 0 }, 3.91);

          // "isn't" → soft grey strike-through, row settles back
          tl.fromTo("#s02-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.inOut" }, 2.63);
          tl.to("#s02-row1", { opacity: 0.5, duration: 0.5, ease: "power2.inOut" }, 3.06);

          // "rates keep rising" lands in poppy, gold glow pulse + end-point glint
          tl.fromTo("#s02-row2", { opacity: 0, y: 30, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "expo.out" }, 4.85);
          tl.fromTo("#s02-row2-txt", { textShadow: "0 0 0px rgba(255,210,122,0)" }, { textShadow: "0 0 26px rgba(255,210,122,0.55)", duration: 0.35, ease: "power2.out" }, 5.15);
          tl.to("#s02-row2-txt", { textShadow: "0 0 0px rgba(255,210,122,0)", duration: 0.5, ease: "power2.inOut" }, 5.5);
          tl.fromTo("#s02-end-halo", { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.7, duration: 0.4, ease: "power2.out" }, 4.9);
          tl.to("#s02-end-halo", { scale: 1, duration: 0.6, ease: "power2.inOut" }, 5.31);

          // blur-through back to the footage
          tl.to("#s02-scene", { opacity: 0, filter: "blur(20px)", duration: 0.35, ease: "power3.in" }, 5.72);

          window.__timelines["s02-problem"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
