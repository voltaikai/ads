    <script src="assets/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand.css">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #13304a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #13304a;
      }
      /* A-roll: framed 280px higher than shot so cards sit under the face (frame.md) */
      #aroll-frame {
        position: absolute;
        left: 0;
        top: -280px;
        width: 1080px;
        height: 1920px;
      }
      #aroll-push,
      #aroll-punch,
      #aroll-soft {
        position: absolute;
        inset: 0;
        transform-origin: 620px 600px; /* the face */
      }
      #aroll {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      /* soft navy vignette under the card + subtitle zone, solid navy in Meta's bottom UI zone */
      #shade {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 120% 70% at 50% 38%, rgba(19, 48, 74, 0) 55%, rgba(19, 48, 74, 0.32) 100%),
          linear-gradient(
            to bottom,
            rgba(19, 48, 74, 0) 0px,
            rgba(19, 48, 74, 0) 800px,
            rgba(19, 48, 74, 0.26) 1040px,
            rgba(19, 48, 74, 0.48) 1260px,
            rgba(19, 48, 74, 0.84) 1480px,
            rgba(19, 48, 74, 1) 1620px
          );
      }
      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
